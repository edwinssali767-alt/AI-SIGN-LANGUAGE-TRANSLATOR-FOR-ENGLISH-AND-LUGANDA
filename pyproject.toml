[project]
name = "sign-language-translator"
version = "1.0.0"
requires-python = ">=3.9,<3.12"
dependencies = [
    "Flask>=2.3.3",
    "Flask-Cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "mediapipe>=0.10.0",
    "joblib>=1.3.0",
    "pytz>=2023.0",
    "scikit-learn>=1.3.0",
    "pymongo>=4.6.0",
    "cloudinary>=1.36.0",
    "gunicorn>=21.0.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"